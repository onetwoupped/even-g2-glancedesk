<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlanceDesk — Even G2</title>
    <style>
      :root {
        --bg: #080d0a;
        --panel: #0f1812;
        --border: #1e3a28;
        --green: #3dff8f;
        --green-dim: #1d7a45;
        --text: #d6f5e3;
        --muted: #78a389;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 14px 36px;
      }
      .shell {
        width: 100%;
        max-width: 720px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 13px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--green-dim);
        color: var(--green);
        font-size: 11px;
      }
      .g2-bezel {
        background: #020503;
        border: 2px solid #244a32;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 0 40px rgba(61, 255, 143, 0.08);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .g2-label {
        width: 100%;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
      }
      #g2-canvas {
        width: 100%;
        max-width: 576px;
        aspect-ratio: 2 / 1;
        background: #000;
        border: 1px solid #163020;
        border-radius: 6px;
        image-rendering: pixelated;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      button {
        background: var(--panel);
        color: var(--green);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 8px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s;
      }
      button:hover {
        background: #16291d;
        border-color: var(--green);
      }
      button:active {
        background: #21402c;
      }
      .meta {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      .meta strong { color: var(--text); }
      .log {
        max-height: 140px;
        overflow-y: auto;
        font-size: 11px;
        background: #050a07;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        color: #8cc9a4;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div><strong>GlanceDesk</strong> · Even G2 (Telegram + Hyperliquid)</div>
        <span id="runtime-badge" class="badge">CONNECTING...</span>
      </div>

      <div class="g2-bezel">
        <div class="g2-label">
          <span>EVEN G2 OPTICAL DISPLAY · 576 × 288 · 4-BIT MONOCHROME GREEN</span>
          <span id="view-indicator">VIEW: FEED</span>
        </div>
        <canvas id="g2-canvas" width="576" height="288"></canvas>
      </div>

      <div class="controls" aria-label="Even G2 Temple and R1 Ring Simulator Controls">
        <button id="btn-up">SWIPE UP (↑)</button>
        <button id="btn-tap">SINGLE TAP (↵)</button>
        <button id="btn-down">SWIPE DOWN (↓)</button>
        <button id="btn-dbl">DBL TAP (Esc)</button>
        <button id="btn-voice">HOLD MIC (V)</button>
      </div>

      <div class="meta" id="status-panel">
        Loading live Telegram + Polymarket state from backend proxy...
      </div>

      <div class="log" id="event-log"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
